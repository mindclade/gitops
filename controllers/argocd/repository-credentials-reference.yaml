apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-credential-binding-contract
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
    gitops.mindclade.io/activation: inactive
data:
  status: inactive
  provider: ExternalSecret
  required-targets: |
    repositoryCredentials:
      secretType: repo-creds
      fields: [url, githubAppID, githubAppInstallationID, githubAppPrivateKey]
    argocdRuntime:
      targetSecret: argocd-secret
      fields: [dex.github.clientID, dex.github.clientSecret]
  activation-requirements: |
    - External Secrets Operator is installed and qualified.
    - A reviewed SecretStore or ClusterSecretStore binding exists.
    - Remote reference identifiers are approved for this environment.
    - No secret value is committed to Git.
