apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: control-plane-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/mindclade/gitops.git
              revision: main
              files:
                - path: environments/*/service-releases.yaml
          - list:
              elementsYaml: '{{ if .active }}{{ .releases | toJson }}{{ else }}[]{{ end }}'
  template:
    metadata:
      name: '{{.environment}}.service.{{.cluster}}.{{.component}}'
      labels:
        gitops.mindclade.io/environment: '{{.environment}}'
        gitops.mindclade.io/release-class: service
        gitops.mindclade.io/component: '{{.component}}'
      annotations:
        gitops.mindclade.io/release-record-digest: '{{.releaseRecordDigest}}'
        gitops.mindclade.io/promotion-receipt-digest: '{{.promotionReceiptDigest}}'
        gitops.mindclade.io/governance-evidence-digest: '{{.governanceEvidenceDigest}}'
    spec:
      project: '{{ if eq .environment "restricted" }}restricted{{ else }}services{{ end }}'
      source:
        repoURL: https://github.com/mindclade/gitops.git
        targetRevision: '{{.desiredStateRevision}}'
        path: '{{.desiredStatePath}}'
        kustomize:
          images:
            - '{{.component}}={{.artifact}}'
      destination:
        name: '{{.cluster}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=false
          - ApplyOutOfSyncOnly=true
          - RespectIgnoreDifferences=true
          - FailOnSharedResource=true
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
