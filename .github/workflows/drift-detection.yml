name: Source and upstream drift detection

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    accept-flake-config = false
    substituters = https://cache.nixos.org/
    trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
    require-sigs = true

concurrency:
  group: gitops-source-drift
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: nix develop --no-accept-flake-config --no-update-lock-file .#ci --command bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
          diagnostic-endpoint: ""
          github-token: ""
          kvm: false
          nix-package-url: https://releases.nixos.org/nix/nix-2.31.2/nix-2.31.2-x86_64-linux.tar.xz
          source-revision: 3477b9e591f27522d437d78b21cb857ce87dd6bb
          summarize: false
          trust-runner-user: false
      - name: Validate desired-state contracts
        run: cd tooling && go run ./cmd/promotectl validate --root ..
      - name: Detect pinned upstream payload drift
        run: cd tooling && go run ./cmd/promotectl verify-bootstrap --root .. --fetch
      - name: Confirm the check produced no repository changes
        shell: bash
        run: test -z "$(git status --porcelain)"
