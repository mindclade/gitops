name: Source and upstream drift detection

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitops-source-drift
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          check-latest: false
          cache: false
      - name: Validate desired-state contracts
        run: cd tooling && go run ./cmd/promotectl validate --root ..
      - name: Detect pinned upstream payload drift
        run: cd tooling && go run ./cmd/promotectl verify-bootstrap --root .. --fetch
      - name: Confirm the check produced no repository changes
        shell: bash
        run: test -z "$(git status --porcelain)"
