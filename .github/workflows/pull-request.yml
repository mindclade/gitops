name: Pull request

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitops-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  USE_BAZEL_VERSION: "9.2.0"

jobs:
  required:
    name: required
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
          diagnostic-endpoint: ""
          github-token: ""
          kvm: false
          nix-package-url: https://releases.nixos.org/nix/nix-2.31.2/nix-2.31.2-x86_64-linux.tar.xz
          source-revision: 3477b9e591f27522d437d78b21cb857ce87dd6bb
          summarize: false
          trust-runner-user: false
      - name: Materialize locked toolchain
        id: nix-toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(nix build --no-link --no-update-lock-file --print-out-paths .#toolchain)"
          test -x "$toolchain/bin/bazelisk"
          printf '%s/bin\n' "$toolchain" >> "$GITHUB_PATH"
      - name: Configure approved Bazel environment
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: false
          cache-save: false
          disk-cache: false
          repository-cache: false
          token: ""
      - name: Verify locked flake outputs
        shell: bash
        run: nix flake check --no-update-lock-file
      - name: Validate exact source tree
        shell: bash
        run: test "$(git ls-files | wc -l | tr -d ' ')" = 129
      - name: Validate source, schemas, renders, and policies
        run: nix develop --no-update-lock-file .#ci --command just validate
      - name: Verify Bazel graph with the Nix-provided Bazelisk
        run: nix develop --no-update-lock-file .#ci --command just bazel-test
      - name: Reject generated source drift
        shell: bash
        run: test -z "$(git status --porcelain)"
