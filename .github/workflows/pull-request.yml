name: Pull request

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitops-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: required
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        accept-flake-config = false
        substituters = https://cache.nixos.org/
        trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
        require-sigs = true
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
          diagnostic-endpoint: ""
          github-token: ""
          kvm: false
          nix-package-url: https://releases.nixos.org/nix/nix-2.31.2/nix-2.31.2-x86_64-linux.tar.xz
          source-revision: 3477b9e591f27522d437d78b21cb857ce87dd6bb
          summarize: false
          trust-runner-user: false
      - name: Materialize locked toolchain
        id: nix-toolchain
        shell: bash
        run: |
          set -euo pipefail
          nix config show --json | jq -e '
            def config_value:
              if type == "object" and has("value") then .value else . end;
            (.substituters | config_value) == ["https://cache.nixos.org/"] and
            (."trusted-public-keys" | config_value) ==
              ["cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY="] and
            (."require-sigs" | config_value) == true and
            (."accept-flake-config" | config_value) == false
          ' >/dev/null
          toolchain="$(nix build --no-accept-flake-config --no-link --no-update-lock-file --print-out-paths .#toolchain)"
          test -x "$toolchain/bin/bazel"
          printf '%s/bin\n' "$toolchain" >> "$GITHUB_PATH"
      - name: Verify locked flake outputs
        shell: bash
        run: nix flake check --no-accept-flake-config --no-update-lock-file
      - name: Validate governed build inputs
        shell: bash
        run: git ls-files --error-unmatch .bazelignore .bazelrc .bazelversion flake.nix flake.lock MODULE.bazel MODULE.bazel.lock
      - name: Validate source, schemas, renders, and policies
        run: nix develop --no-accept-flake-config --no-update-lock-file .#ci --command just validate
      - name: Verify Bazel graph with Nix-provided Bazel
        run: nix develop --no-accept-flake-config --no-update-lock-file .#ci --command just bazel-test
      - name: Reject generated source drift
        shell: bash
        run: test -z "$(git status --porcelain)"
